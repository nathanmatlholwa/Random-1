# XcodeGen spec. Run `xcodegen generate` in this folder to create MathsToFailure.xcodeproj.
name: MathsToFailure
options:
  bundleIdPrefix: app.mathstofailure
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MathsToFailure:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mathstofailure.MathsToFailure
        TARGETED_DEVICE_FAMILY: "2"          # iPad
        SUPPORTS_MACCATALYST: YES            # Mac, via Mac Catalyst
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_ENTITLEMENTS: MathsToFailure.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maths to Failure
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of your handwritten working so it can be marked.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_PREVIEWS: YES
  MathsToFailureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MathsToFailure
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
schemes:
  MathsToFailure:
    build:
      targets:
        MathsToFailure: all
    test:
      targets:
        - MathsToFailureTests
